name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          fi

      - name: Detect Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::Could not find $GRADLE_FILE"
            exit 1
          fi

          COMPILE_SDK=$(
            grep -oP 'compileSdk\s*=\s*\K[0-9]+' "$GRADLE_FILE" |
            head -n 1
          )

          BUILD_TOOLS=$(
            grep -oP 'buildToolsVersion\s*=\s*"\K[^"]+' "$GRADLE_FILE" |
            head -n 1 || true
          )

          NDK_VERSION=$(
            grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$GRADLE_FILE" |
            head -n 1 || true
          )

          BUILD_TOOLS="${BUILD_TOOLS:-37.0.0}"
          NDK_VERSION="${NDK_VERSION:-27.3.13750724}"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

          echo "compileSdk: $COMPILE_SDK"
          echo "buildTools: $BUILD_TOOLS"
          echo "ndkVersion: $NDK_VERSION"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          PLATFORM_PACKAGE="platforms;android-${COMPILE_SDK}"

          # API 37 is published as android-37.0 on the current
          # Ubuntu 24.04 GitHub runner images.
          if [ "$COMPILE_SDK" = "37" ]; then
            PLATFORM_PACKAGE="platforms;android-37.0"
          fi

          echo "Installing Android platform:"
          echo "$PLATFORM_PACKAGE"

          sdkmanager \
            "$PLATFORM_PACKAGE" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          if [ "$COMPILE_SDK" = "37" ] &&
             [ -d "$ANDROID_HOME/platforms/android-37.0" ] &&
             [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s \
              "$ANDROID_HOME/platforms/android-37.0" \
              "$ANDROID_HOME/platforms/android-37"
          fi

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK not found at $NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "Android NDK:"
          echo "$NDK_PATH"

      - name: Build APK
        shell: bash
        env:
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail

          pnpm tauri android build --apk --ci

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          find \
            src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowdo-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
