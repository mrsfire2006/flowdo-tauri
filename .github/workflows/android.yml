name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm tauri android init --ci
          fi

      - name: Detect Android build requirements
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::Could not find $GRADLE_FILE"
            exit 1
          fi

          COMPILE_SDK="$(
            grep -oP 'compileSdk\s*=\s*\K[0-9]+' "$GRADLE_FILE" |
            head -n 1 || true
          )"

          BUILD_TOOLS="$(
            grep -oP 'buildToolsVersion\s*=\s*"\K[^"]+' "$GRADLE_FILE" |
            head -n 1 || true
          )"

          NDK_VERSION="$(
            grep -oP 'ndkVersion\s*=\s*"\K[^"]+' "$GRADLE_FILE" |
            head -n 1 || true
          )"

          COMPILE_SDK="${COMPILE_SDK:-37}"
          BUILD_TOOLS="${BUILD_TOOLS:-37.0.0}"
          NDK_VERSION="${NDK_VERSION:-27.3.13750724}"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

          echo "compileSdk=$COMPILE_SDK"
          echo "buildTools=$BUILD_TOOLS"
          echo "ndkVersion=$NDK_VERSION"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          PLATFORM_PACKAGE="platforms;android-${COMPILE_SDK}"

          # Current Ubuntu GitHub runner images expose API 37
          # as platforms;android-37.0.
          if [ "$COMPILE_SDK" = "37" ]; then
            PLATFORM_PACKAGE="platforms;android-37.0"
          fi

          echo "Installing Android platform: $PLATFORM_PACKAGE"
          echo "Installing Build Tools: $BUILD_TOOLS"
          echo "Installing NDK: $NDK_VERSION"

          sdkmanager \
            "$PLATFORM_PACKAGE" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK not found at $NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          # Gradle/Tauri compatibility for API 37.
          if [ "$COMPILE_SDK" = "37" ] &&
             [ -d "$ANDROID_HOME/platforms/android-37.0" ] &&
             [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s \
              "$ANDROID_HOME/platforms/android-37.0" \
              "$ANDROID_HOME/platforms/android-37"
          fi

          echo "Android SDK configured."
          echo "ANDROID_NDK_HOME=$NDK_PATH"

      - name: Configure Android NDK toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -d "$NDK_BIN" ]; then
            echo "::error::NDK toolchain directory not found:"
            echo "$NDK_BIN"
            exit 1
          fi

          for tool in \
            clang \
            clang++ \
            llvm-ar \
            llvm-ranlib \
            llvm-strip; do

            if [ ! -x "$NDK_BIN/$tool" ]; then
              echo "::error::Missing NDK tool: $NDK_BIN/$tool"
              exit 1
            fi
          done

          # GITHUB_PATH affects following steps.
          echo "$NDK_BIN" >> "$GITHUB_PATH"

          # This affects the current step as well.
          export PATH="$NDK_BIN:$PATH"

          # OpenSSL/openssl-src can request the old target-specific
          # ranlib names. Map them to the LLVM tool shipped by the NDK.
          ln -sf \
            "$NDK_BIN/llvm-ranlib" \
            "$NDK_BIN/aarch64-linux-android-ranlib"

          ln -sf \
            "$NDK_BIN/llvm-ranlib" \
            "$NDK_BIN/arm-linux-androideabi-ranlib"

          ln -sf \
            "$NDK_BIN/llvm-ranlib" \
            "$NDK_BIN/i686-linux-android-ranlib"

          ln -sf \
            "$NDK_BIN/llvm-ranlib" \
            "$NDK_BIN/x86_64-linux-android-ranlib"

          # Tell the cc crate explicitly which ranlib to use.
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64-linux-android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_armv7-linux-androideabi=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_armv7_linux_androideabi=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_i686-linux-android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_i686_linux_android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_x86_64-linux-android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "RANLIB_x86_64_linux_android=$NDK_BIN/llvm-ranlib" >> "$GITHUB_ENV"

          # Also provide the LLVM archiver explicitly.
          echo "AR=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_armv7-linux-androideabi=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_i686-linux-android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_i686_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_x86_64-linux-android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

          echo "Android NDK toolchain configured."
          echo "NDK_BIN=$NDK_BIN"

          echo "Checking tools:"
          command -v llvm-ranlib
          command -v llvm-ar
          command -v aarch64-linux-android-ranlib

          echo "ranlib resolves to:"
          readlink -f "$(command -v aarch64-linux-android-ranlib)"

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Node:"
          node --version

          echo
          echo "pnpm:"
          pnpm --version

          echo
          echo "Rust:"
          rustc --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "NDK compiler:"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

          echo
          echo "OpenSSL ranlib:"
          command -v aarch64-linux-android-ranlib

      - name: Build APK
        shell: bash
        env:
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail

          pnpm tauri android build --apk --ci

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found:"
            echo "$APK_DIR"
            exit 1
          fi

          echo "Generated APK files:"
          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowdo-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
